volumes:
  postgres_data:
  redis_data:
  storage_data:

services:
  base: &base
    image: ghcr.io/edwardkraaka/chatwootfreepremium:feature-sip-dial-asterisk
    env_file: .env
    volumes:
      - storage_data:/app/storage
    restart: unless-stopped

  rails:
    <<: *base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - POSTGRES_USERNAME=postgres
      - POSTGRES_DATABASE=chatwoot_production
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/v1/health_check']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  sidekiq:
    <<: *base
    depends_on:
      rails:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - POSTGRES_USERNAME=postgres
      - POSTGRES_DATABASE=chatwoot_production
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d chatwoot_production || pg_isready -U postgres -d postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ['sh', '-c', 'redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 500mb --maxmemory-policy allkeys-lru']
    env_file: .env
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 10s
      timeout: 5s
      retries: 5
